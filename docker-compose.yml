services:
  postgres:
    image: postgres:16-alpine
    container_name: nest_store_db_t09
    restart: unless-stopped
    environment:
      POSTGRES_USER: nest_user
      POSTGRES_PASSWORD: nest_password
      POSTGRES_DB: store_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nest_user -d store_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
